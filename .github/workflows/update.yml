name: Atualizar Monitor TSE

on:
  schedule:
    - cron: '0 9 * * *'   # 06:00 BRT (UTC-3) = 09:00 UTC
  workflow_dispatch:        # permite rodar manualmente pelo GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Criar pastas necessárias
        run: mkdir -p data reports/archive reports/pdfs

      - name: Executar agente TSE
        run: python agent.py
        env:
          CI: "true"

      - name: Upload para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
